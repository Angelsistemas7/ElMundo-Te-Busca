version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
    groups:
      next-react:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "@types/react*"
      supabase:
        patterns:
          - "@supabase/*"
      dev-tooling:
        dependency-type: "development"
        applies-to: "version-updates"
    labels:
      - "dependencias"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
